<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} - XIAOJIE4082</title>
  <meta name="description" content="{{ site.description }}">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;800&display=swap"
    rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% seo %}
</head>

<body>
  <!-- 滾動進度條 -->
  <div id="scroll-progress"></div>

  <!-- 導航欄 -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand" href="{{ '/' | relative_url }}">XIAOJIE4082</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="切換導航選單">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <li class="nav-item">
            <a class="nav-link" href="{{ '/' | relative_url }}#about">_關於我</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ '/' | relative_url }}#education">_教育背景</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ '/' | relative_url }}#experience">_工作經驗</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ '/' | relative_url }}#skills">_專業技能</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ '/' | relative_url }}#projects">_專案作品</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ '/' | relative_url }}#history">_經歷</a>
          </li>
          <li class="nav-item ms-lg-2">
            <a class="nav-link nav-contact" href="#footer">聯絡我</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <!-- 頁尾 -->
  <footer class="footer py-5" id="footer">
    <div class="container">
      <div class="footer-top-line mb-4"></div>
      <div class="row gy-4 justify-content-center align-items-start text-center">
        <!-- Brand -->
        <div class="col-lg-4">
          <div class="footer-brand mb-2">XIAOJIE4082</div>
          <p class="footer-bio">軟體開發者</p>
        </div>
        <!-- 聯絡資訊 -->
        <div class="col-sm-6 col-lg-4">
          <h6 class="footer-heading">// 聯絡資訊</h6>
          <div class="footer-contact-list align-items-center">
            <a href="mailto:service@xiaojie4082.cc" class="footer-contact-item justify-content-center">
              <span class="footer-contact-icon"><i class="fas fa-envelope"></i></span>
              <span>service@xiaojie4082.cc</span>
            </a>
          </div>
        </div>
        <!-- 社群連結 -->
        <div class="col-sm-6 col-lg-4">
          <h6 class="footer-heading">// 社群連結</h6>
          <div class="social-links justify-content-center">
            <a href="https://github.com/xiaojie4082" target="_blank" class="github-link" aria-label="GitHub">
              <i class="fab fa-github"></i>
            </a>
            <a href="https://www.instagram.com/xiaojie4082" target="_blank" class="instagram-link"
              aria-label="Instagram">
              <i class="fab fa-instagram"></i>
            </a>
          </div>
        </div>
      </div>
      <div class="footer-divider my-4"></div>
      <div class="text-center">
        <p class="mb-0 copyright">
          <span class="font-mono" style="color:var(--primary)">©</span>
          <script>document.write(new Date().getFullYear())</script>
          XIAOJIE4082. All rights reserved.
        </p>
      </div>
    </div>
  </footer>

  <!-- 回頁頂按鈕 -->
  <button id="scrollTopBtn" aria-label="回到頂部">
    <i class="fas fa-chevron-up"></i>
  </button>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ===== 滾動進度條 =====
    const progressBar = document.getElementById('scroll-progress');
    function updateProgress() {
      const scrolled = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
      if (progressBar) progressBar.style.width = Math.min(scrolled, 100) + '%';
    }
    window.addEventListener('scroll', updateProgress, { passive: true });

    // ===== 導航欄滾動效果 =====
    const mainNav = document.getElementById('mainNav');
    window.addEventListener('scroll', function () {
      mainNav && mainNav.classList.toggle('navbar-scrolled', window.scrollY > 50);
    }, { passive: true });

    // ===== 平滑滾動 =====
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        const href = this.getAttribute('href');
        if (!href || href === '#') return;
        const target = document.querySelector(href);
        if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth' }); }
      });
    });

    // ===== Active nav link 高亮 =====
    const sections = document.querySelectorAll('section[id]');
    const navLinks = document.querySelectorAll('.nav-link');
    const sectionObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          navLinks.forEach(link => {
            link.classList.remove('active');
            if (link.getAttribute('href') && link.getAttribute('href').includes('#' + entry.target.id)) {
              link.classList.add('active');
            }
          });
        }
      });
    }, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
    sections.forEach(s => sectionObserver.observe(s));

    // ===== Scroll-triggered fade-up =====
    const fadeObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          fadeObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });

    document.querySelectorAll('.alt-timeline-item, .bento-item, .skill-category, .edu-card').forEach((el, i) => {
      el.classList.add('fade-up');
      el.style.transitionDelay = (i * 60) + 'ms';
      fadeObserver.observe(el);
    });

    // ===== 回頁頂按鈕 =====
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => {
      scrollTopBtn && scrollTopBtn.classList.toggle('visible', window.scrollY > 400);
    }, { passive: true });
    scrollTopBtn && scrollTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // ===== 向下滾動指示器 =====
    const scrollIndicator = document.querySelector('.scroll-down-indicator');
    if (scrollIndicator) {
      scrollIndicator.addEventListener('click', () => {
        const next = document.querySelector('#experience');
        if (next) next.scrollIntoView({ behavior: 'smooth' });
      });
    }
  </script>
</body>

</html>
